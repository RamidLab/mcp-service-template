[project]
name = "service-mcp"
version = "0.2.0"
description = "A generic FastMCP server template with SQLAlchemy async CRUD"
readme = "README.md"
keywords = ["mcp", "template", "crud"]
license = { text = "MIT" }
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiohttp>=3.14.1",
    "cryptography>=50.0.0",
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.14",
    "asyncpg>=0.31.0",
    "booktype>=1.5",
    "fastapi>=0.141.1",
    "fastmcp[tasks]>=3.4.7",
    "influxdb-client>=1.50.0",
    "prefab-ui>=0.20.2",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings[toml]>=2.15.0",
    "pymysql>=1.2.0",
    "pysqlite3>=0.6.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=4.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "faker>=40.23.0",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.17",
]

[project.scripts]
service-mcp = "service_mcp.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 显式声明包目录：项目名（连字符）与包名（下划线）不一致时 hatchling 也能正确定位；
# rename_project.py 改名时会同步替换此处
packages = ["service_mcp"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
extend-exclude = [
    "service_mcp/models/pydantic/filter.pyi",
    "service_mcp/models/pydantic/search.pyi",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking (move imports to TYPE_CHECKING blocks)
    "FA",   # flake8-future-annotations
    "PLC",  # pylint convention
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "TRY",  # tryceratops
    "PERF", # perflint
]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "E741",    # ambiguous variable name (common in math/finance code)
    "B007",    # unused loop variable — sometimes _ prefix is less clear
    "B008",    # do not perform function calls in argument defaults (FastMCP Depends on pattern)
    "B026",    # star-arg unpacking after keyword arg — valid in this context
    "B039",    # contextvar .set() — intentional mutation
    "B904",    # raise without from — exception chaining not always needed
    "B905",    # zip() without strict= — lengths are guaranteed equal by design
    "E731",    # lambda assignment — sometimes more concise
    "N804",    # first arg of classmethod should be `cls` — pydantic model_validator uses `self`
    "N806",    # variable in function should be lowercase — business naming conventions
    "PERF102", # inefficient dict iteration — dict.items() is fine for clarity
    "PERF203", # try-except in loop — unavoidable in some cases
    "PERF401", # list comprehension vs loop — loop is clearer in some cases
    "PLC0415", # import not at top of file — lazy imports are intentional
    "PLR2004", # magic values in comparison — unavoidable in business logic
    "PLW0108", # unnecessary lambda — sometimes for API compatibility
    "PLW0603", # global statement usage — used for settings singleton
    "PLW1510", # subprocess.run without check — caller handles errors
    "PLW2901", # loop variable overwritten — intentional reuse for cleaned value
    "PT011",   # pytest.raises too broad — acceptable in some test scenarios
    "PT019",   # fixture without value — parameter naming is API convention
    "RET504",  # unnecessary assignment before return — sometimes for clarity
    "RUF001",  # ambiguous Unicode char in string — Chinese fullwidth punctuation is intentional
    "RUF002",  # ambiguous Unicode char in docstring — Chinese fullwidth punctuation is intentional
    "RUF003",  # ambiguous Unicode char in comment — Chinese fullwidth punctuation is intentional
    "RUF012",  # mutable class attributes should be annotated with ClassVar (pydantic models)
    "RUF013",  # missing None in union type annotation — explicit is not always better
    "RUF034",  # useless type: ignore — sometimes needed for mypy compatibility
    "RUF059",  # unused unpacked variable — prefix with _ is not always clearer
    "SIM102",  # combine if statements — nested ifs are sometimes clearer
    "SIM105",  # contextlib.suppress — try/except is sometimes clearer
    "SIM108",  # use ternary operator — often less readable
    "SIM115",  # use context manager for open() — handled in other code paths
    "SIM117",  # combine with statements — nested with is more readable in UI code
    "SIM118",  # key in dict.keys() — sometimes for consistency with .values()
    "TC001",   # move imports into TYPE_CHECKING — too aggressive for runtime pydantic
    "TC002",   # move imports into TYPE_CHECKING — too aggressive for runtime pydantic
    "TC003",   # move imports into TYPE_CHECKING — too aggressive for runtime pydantic
    "TC006",   # quotes in typing.cast() — conflicts with PyCharm (string cast triggers IDE errors)
    "TRY002",  # custom exception attributes — not always needed
    "TRY003",  # avoid specifying long messages outside exception class
    "TRY300",  # consider moving to else block — try/except/return is clear enough
    "TRY301",  # abstract raise to inner function — not needed for simple guards
    "TRY401",  # redundant exception handling — sometimes for logging
    "UP042",   # @staticmethod — sometimes for clarity
    "UP046",   # non-abstract protocol — practical protocols don't need abstract methods
    "UP047",   # deprecated type alias — backward compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["service_mcp"]
force-single-line = false
lines-after-imports = 2
lines-between-types = 0

# isort 标准配置（PyCharm 等 IDE 读取此段做导入排序检查，与 ruff 的
# known-first-party / 空行规则保持一致，避免 I001 误报）
[tool.isort]
known_first_party = ["service_mcp"]
profile = "black"
lines_after_imports = 2
lines_between_types = 0

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.validator", "pydantic.field_validator", "model_validator"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # magic values in test assertions
    "SIM117",   # combine with statements in tests
    "PLW0603",  # global in tests
    "B017",     # pytest.raises should not raise a blanket exception
    "PT011",    # pytest.raises too broad
    "PT012",    # pytest.raises should use match
    "RET504",   # unnecessary assignment in tests
    "PERF203",  # try-except in loop in tests
    "SIM102",   # combine if statements in tests
    "B007",     # unused loop variable in tests
    "PERF102",  # inefficient dict iteration in tests
    "SIM105",   # contextlib.suppress in tests
    "PLW0108",  # unnecessary lambda in tests
    "TRY300",   # try/except style in tests
    "TRY301",   # abstract raise in tests
    "RUF059",   # unused unpacked variable in tests
    "PLW2901",  # loop variable overwritten in tests
    "RUF034",   # type ignore in tests
    "RUF100",   # unused noqa directive (PyCharm uses # noqa for inspection suppression)
    "E731",     # lambda assignment in tests
]
"scripts/**/*.py" = [
    "PLR2004",
    "T201",     # print() allowed in scripts
    "PLW1510",  # subprocess.run without check in scripts
    "PERF403",  # dict comprehension vs loop in scripts
]
"mock/**/*.py" = [
    "PLR2004",
    "T201",
]
"service_mcp/apps/prefab_compat.py" = [
    "A002",     # shadowing built-in 'id' — prefab_ui API uses 'id' as parameter name
]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "skip"
exclude = [
    "\\.venv",
    "scripts",
    "mock",
]

[[tool.mypy.overrides]]
module = [
    "service_mcp.utils.enums",
]
disable_error_code = ["misc", "attr-defined", "override", "assignment", "call-arg", "return-value", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "service_mcp.tools.query_tools",
    "service_mcp.tools.crud_tools",
    "service_mcp.tools.crud_factory",
    "service_mcp.tools",
    "service_mcp.handlers.query_handlers",
    "service_mcp.handlers.add_handlers",
    "service_mcp.handlers.update_handlers",
    "service_mcp.handlers.delete_handlers",
    "service_mcp.handlers.base_handlers",
]
disable_error_code = ["valid-type", "arg-type", "no-any-return", "var-annotated", "attr-defined", "call-arg", "assignment"]

[[tool.mypy.overrides]]
module = [
    "service_mcp.models.pydantic",
    "service_mcp.models.pydantic.builder",
    "service_mcp.models.pydantic.filter",
    "service_mcp.models.pydantic.product",
    "service_mcp.models.schemas",
]
disable_error_code = ["arg-type", "no-any-return", "var-annotated", "override", "assignment", "misc", "attr-defined", "prop-decorator", "union-attr", "valid-type"]

[[tool.mypy.overrides]]
module = [
    "service_mcp.apps.config_app",
]
disable_error_code = ["arg-type", "no-any-return", "var-annotated", "assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "service_mcp.db.core",
]
disable_error_code = ["arg-type", "no-any-return", "var-annotated", "assignment", "misc"]