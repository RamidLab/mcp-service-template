# 模板配置骨架（无敏感信息）。
# 实际使用：复制为 configs/config.{MCP_ENV}.toml（如 configs/config.dev.toml），
# 该文件已被 .gitignore 忽略，不会入库。
# 不提供时服务首次启动会自动生成默认配置（SQLite 内存 + Redis）。
cache_enabled = true
timezone = "Asia/Shanghai"

[databases.default]
db_type = "postgresql"
db_host = "127.0.0.1"
db_port = 5432
db_sql_echo = "close"
db_pool_size = 5
status = "未知"
db_username = "postgres"
db_password = "postgres"
db_main = "service_data"

[caches.default]
cache_type = "redis"
cache_host = "127.0.0.1"
cache_port = 6379
cache_main = 0
databases = 16
timeout = 5
ttl_seconds = 300
max_size = 1024
cache_pool_size = 10
